name: Build Launcher3 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # JDK 8 para Gradle 2.14 / AGP 2.1.3 (el último de la lista queda como JAVA_HOME).
      # JDK 17 solo se usa para ejecutar sdkmanager.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            8

      - name: Localizar el proyecto
        run: |
          MANIFEST=$(find . -maxdepth 2 -name AndroidManifest-common.xml | head -1)
          echo "PROJECT_DIR=$(dirname "$MANIFEST")" >> "$GITHUB_ENV"

      - name: Instalar Android SDK 25 y build-tools 24.0.0
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | JAVA_HOME="$JAVA_HOME_17_X64" "$SDKMANAGER" --licenses > /dev/null || true
          JAVA_HOME="$JAVA_HOME_17_X64" "$SDKMANAGER" "platforms;android-25" "build-tools;24.0.0" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

      - name: Instalar Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      # Repositorios extra por init script, sin tocar el build.gradle original
      # (las support libs 23.x ya no están en Maven Central).
      - name: Configurar repositorios de Gradle
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/repos.gradle" <<'GRADLE'
          allprojects {
              buildscript {
                  repositories {
                      jcenter()
                      mavenCentral()
                      maven { url 'https://maven.google.com' }
                  }
              }
              repositories {
                  jcenter()
                  mavenCentral()
                  maven { url 'https://maven.google.com' }
              }
          }
          GRADLE

      - name: Compilar APK (debug)
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleAospDebug --stacktrace --no-daemon

      - name: Listar APKs generados
        run: find "$PROJECT_DIR/build/outputs" -name "*.apk" -exec ls -la {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: Launcher3-Pixel-v1.0-dark252525-apk
          path: ${{ env.PROJECT_DIR }}/build/outputs/apk/*.apk
          if-no-files-found: error
